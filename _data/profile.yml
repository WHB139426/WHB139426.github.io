short_bio: >-
  <p>
    I am a Ph.D. student in Computer Science at the
    <a href="https://cs.ucdavis.edu/" target="_blank">University of California, Davis</a>,
    advised by Prof.
    <a href="https://wilburone.github.io/" target="_blank">Lifu Huang</a>.
    Previously, I received my master's degree from
    <a href="https://cs.fudan.edu.cn/" target="_blank">Fudan University</a>,
    advised by Prof.
    <a href="https://www.weifengge.net/" target="_blank">Weifeng Ge</a>,
    and my bachelor's degree from
    <a href="https://cse.seu.edu.cn/" target="_blank">Southeast University</a>.
  </p>
  <p>
    My research focuses on multimodal large language models and their applications,
    including spatial intelligence, video understanding, and unified multimodal
    understanding and generation.
  </p>

